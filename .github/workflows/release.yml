name: Release

# Push a tag like v1.0.0 to build whq for every platform, publish a GitHub release with the
# binaries and their SHA-256 checksums, and update the Homebrew formula in webhook-hq/homebrew-tap
# (brew install webhook-hq/tap/whq). The tap update needs the HOMEBREW_TAP_TOKEN secret: a
# fine-grained token with Contents read and write on webhook-hq/homebrew-tap only. Pre-releases
# update the formula too, so brew can be tested with one before the real release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# One release at a time: two tags pushed together would race to update the Homebrew tap.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: VERSION=${GITHUB_REF_NAME} script/build --release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a suffix (v1.0.0-rc.1) is a pre-release: it isn't "latest", so the download
        # links in the docs keep pointing at the last real release.
        run: |
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* --title "whq $GITHUB_REF_NAME" --generate-notes $prerelease
      - name: Update the Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/webhook-hq/homebrew-tap.git" tap
          mkdir -p tap/Formula
          script/homebrew_formula "$GITHUB_REF_NAME" > tap/Formula/whq.rb
          cd tap
          git config user.name "whq release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/whq.rb
          git commit -m "whq ${GITHUB_REF_NAME#v}"
          git push origin HEAD
