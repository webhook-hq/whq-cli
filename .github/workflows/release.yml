name: Release

# Push a tag like v1.0.0 to build whq for every platform and publish a GitHub release with the
# binaries and their SHA-256 checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: VERSION=${GITHUB_REF_NAME} script/build --release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "whq $GITHUB_REF_NAME" --generate-notes
